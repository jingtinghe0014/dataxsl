version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: '%(asctime)s - [%(processName)s PID=%(process)d] - %(name)s - %(levelname)s - %(message)s'
  detailed:
    format: '%(asctime)s - [%(processName)s PID=%(process)d] - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout
  file_handler:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/data_xsl.log
    when: midnight
    interval: 1
    backupCount: 30
    encoding: utf8
  error_file_handler:
    class: logging.handlers.TimedRotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/errors.log
    when: midnight
    interval: 1
    backupCount: 30
    encoding: utf8
loggers: {}
root:
  level: DEBUG
  handlers:
  - console
  - file_handler
  - error_file_handler
